name: Build RA-PSP Diagnostic

on:
  push:
    branches: [ra-psp-diag]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pspdev/pspdev-docker:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build diagnostic EBOOT
        working-directory: ra-psp-diag
        run: make clean && make -j2

      - name: Build memory-test PRX
        working-directory: ra-psp-prx
        run: make clean && make -j2

      - name: Build flow simulator
        working-directory: ra-psp-sim
        run: make clean && make -j2

      - name: Package
        run: |
          mkdir -p artifact/RA-PSP
          cp ra-psp-diag/EBOOT.PBP artifact/RA-PSP/DIAGNOSTIC_EBOOT.PBP
          cp ra-psp-prx/ra_psp_memtest.prx artifact/RA-PSP/ra_psp_memtest.prx
          cp ra-psp-sim/EBOOT.PBP artifact/RA-PSP/SIMULATOR_EBOOT.PBP
          cp ra-psp-sim/ra_psp_sim.elf artifact/RA-PSP/RA_PSP_SIM.elf
          cp ra-psp-sim/main.c artifact/RA-PSP/simulator_main.c
          printf '%s\n' \
            'RA-PSP FLOW SIMULATOR' \
            '' \
            'Put SIMULATOR_EBOOT.PBP in:' \
            '  PSP/GAME/RA-PSP-SIM/EBOOT.PBP' \
            '' \
            'Controls:' \
            '  X        increase simulated game memory progress' \
            '  TRIANGLE toggle network online/offline' \
            '  SQUARE   reset scenario' \
            '  CIRCLE   exit' \
            '' \
            'Recommended scenario:' \
            '  1. Start offline.' \
            '  2. Press X ten times.' \
            '  3. Achievement popup should show SAVED OFFLINE.' \
            '  4. Press TRIANGLE.' \
            '  5. Queue changes to SYNCED and log records confirmation.' \
            '' \
            'Log:' \
            '  ms0:/PSP/RA_SIM_LOG.txt' \
            > artifact/RA-PSP/README_SIM.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RA-PSP-FLOW-SIM-v0.1
          path: artifact/RA-PSP
