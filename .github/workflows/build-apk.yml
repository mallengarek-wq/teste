name: Build ConquestWars APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Download project package
        run: |
          python -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1_4vqE8YznnuiJpLPbNO-WnjPOApRa2Vo' -O ConquestWars_Android_Min.zip
          test -s ConquestWars_Android_Min.zip

      - name: Extract project
        run: unzip -q ConquestWars_Android_Min.zip

      - name: Build debug APK
        working-directory: ConquestWars_Android_Min
        run: gradle --no-daemon app:assembleDebug

      - name: Prepare APK
        run: cp ConquestWars_Android_Min/app/build/outputs/apk/debug/app-debug.apk ConquestWars.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConquestWars-APK
          path: ConquestWars.apk
          if-no-files-found: error
          retention-days: 30
