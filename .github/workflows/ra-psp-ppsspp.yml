name: Build RA-PSP PPSSPP

on:
  push:
    branches: [ra-psp-diag]
    paths:
      - 'ra-psp-ppsspp/**'
      - '.github/workflows/ra-psp-ppsspp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pspdev/pspdev-docker:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned rcheevos
        run: git clone --depth 1 --branch v12.5.0 https://github.com/RetroAchievements/rcheevos.git third_party/rcheevos

      - name: Build rcheevos for PSP
        run: |
          mkdir -p build/rcheevos/obj
          set -e
          FILES="third_party/rcheevos/src/rc_client.c third_party/rcheevos/src/rc_compat.c third_party/rcheevos/src/rc_util.c third_party/rcheevos/src/rcheevos/*.c third_party/rcheevos/src/rapi/*.c third_party/rcheevos/src/rhash/*.c"
          for f in $FILES; do
            case "$f" in *rc_libretro.c|*rc_client_external.c|*rc_client_raintegration.c) continue ;; esac
            o="build/rcheevos/obj/$(echo "$f" | sed 's#[/.]#_#g').o"
            psp-gcc -O2 -G0 -DRC_DISABLE_LUA -DRC_NO_THREADS -Ithird_party/rcheevos/include -Ithird_party/rcheevos/src -c "$f" -o "$o"
          done
          psp-ar rcs build/rcheevos/librcheevos.a build/rcheevos/obj/*.o

      - name: Build PPSSPP online plugin
        working-directory: ra-psp-ppsspp
        run: make clean && make -j2

      - name: Package direct-drop install
        run: |
          mkdir -p artifact/memstick/PSP/PLUGINS/RA-PSP
          cp ra-psp-ppsspp/ra_psp_ppsspp.prx artifact/memstick/PSP/PLUGINS/RA-PSP/ra_psp_ppsspp.prx
          cp ra-psp-ppsspp/plugin.ini artifact/memstick/PSP/PLUGINS/RA-PSP/plugin.ini
          printf '%s\n' \
            'username=SEU_USUARIO_RETROACHIEVEMENTS' \
            'password=SUA_SENHA_RETROACHIEVEMENTS' \
            'game_hash=dcf3cb505ca49469ea2667d0398cea10' \
            > artifact/memstick/PSP/PLUGINS/RA-PSP/login.ini.example
          printf '%s\n' \
            'RA-PSP PPSSPP ONLINE v0.6' \
            '' \
            'Extract directly into:' \
            'E:\\SteamLibrary\\steamapps\\common\\Emuladores\\PSP\\' \
            '' \
            'Target: Persona 2 Innocent Sin USA - ULUS10584' \
            'Open menu: L + R + SELECT' \
            'Fallback: START + SELECT' \
            '' \
            'FIRST LOGIN (only if auth.ini does not already exist):' \
            '1. Rename login.ini.example to login.ini.' \
            '2. Fill username/password.' \
            '3. USA original hash is already filled in.' \
            '4. Undub v1.0 hash: f61a77e87f871e717d793f9a3e5fc853' \
            '5. Start the game. Successful password login creates auth.ini with a token.' \
            '6. Delete login.ini after auth.ini is created.' \
            '' \
            'The plugin also accepts legacy auth.ini locations from earlier RA-PSP builds.' \
            'Enable Networking/WLAN in PPSSPP for online login.' \
            '' \
            'Menu shows live login/network/set state, real account name and real achievement summary when loaded.' \
            'Achievement runtime calls rc_client_do_frame while the game is active.' \
            'Unlocks are logged and shown as the last unlock in the menu; popup rendering comes next.' \
            '' \
            'Log:' \
            'memstick\\PSP\\PLUGINS\\RA-PSP\\ra_psp_ppsspp.log' \
            > artifact/README-RA-PSP-PPSSPP.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RA-PSP-PPSSPP-v0.6-ONLINE-RCCLIENT-DROPIN
          path: artifact
