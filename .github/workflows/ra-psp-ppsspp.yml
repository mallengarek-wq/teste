name: Build RA-PSP PPSSPP

on:
  push:
    branches: [ra-psp-diag]
    paths:
      - 'ra-psp-ppsspp/**'
      - 'ra-bridge/**'
      - '.github/workflows/ra-psp-ppsspp.yml'
  workflow_dispatch:

jobs:
  plugin:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pspdev/pspdev-docker:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned rcheevos
        run: git clone --depth 1 --branch v12.5.0 https://github.com/RetroAchievements/rcheevos.git third_party/rcheevos

      - name: Build rcheevos for PSP
        run: |
          mkdir -p build/rcheevos/obj
          set -e
          FILES="third_party/rcheevos/src/rc_client.c third_party/rcheevos/src/rc_compat.c third_party/rcheevos/src/rc_util.c third_party/rcheevos/src/rcheevos/*.c third_party/rcheevos/src/rapi/*.c third_party/rcheevos/src/rhash/*.c"
          for f in $FILES; do
            case "$f" in *rc_libretro.c|*rc_client_external.c|*rc_client_raintegration.c) continue ;; esac
            o="build/rcheevos/obj/$(echo "$f" | sed 's#[/.]#_#g').o"
            psp-gcc -O2 -G0 -DRC_DISABLE_LUA -DRC_NO_THREADS -Ithird_party/rcheevos/include -Ithird_party/rcheevos/src -c "$f" -o "$o"
          done
          psp-ar rcs build/rcheevos/librcheevos.a build/rcheevos/obj/*.o

      - name: Build PPSSPP bridge plugin
        working-directory: ra-psp-ppsspp
        run: make clean && make -j2

      - name: Prepare plugin part
        run: |
          mkdir -p plugin-part
          cp ra-psp-ppsspp/ra_psp_ppsspp.prx plugin-part/ra_psp_ppsspp.prx
          cp ra-psp-ppsspp/plugin.ini plugin-part/plugin.ini

      - uses: actions/upload-artifact@v4
        with:
          name: ra-psp-plugin-part
          path: plugin-part

  package:
    needs: plugin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download PSP plugin part
        uses: actions/download-artifact@v4
        with:
          name: ra-psp-plugin-part
          path: plugin-part

      - name: Build self-contained Windows RA Bridge
        shell: pwsh
        run: |
          dotnet publish ra-bridge/RA-Bridge.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o build/ra-bridge
          if (-not (Test-Path 'build/ra-bridge/RA-Bridge.exe')) { throw 'RA-Bridge.exe was not produced' }

      - name: Package direct-drop install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'artifact/memstick/PSP/PLUGINS/RA-PSP' | Out-Null
          Copy-Item 'plugin-part/ra_psp_ppsspp.prx' 'artifact/memstick/PSP/PLUGINS/RA-PSP/ra_psp_ppsspp.prx'
          Copy-Item 'plugin-part/plugin.ini' 'artifact/memstick/PSP/PLUGINS/RA-PSP/plugin.ini'
          Copy-Item 'build/ra-bridge/RA-Bridge.exe' 'artifact/RA-Bridge.exe'

          @'
          username=SEU_USUARIO_RETROACHIEVEMENTS
          password=SUA_SENHA_RETROACHIEVEMENTS
          game_hash=dcf3cb505ca49469ea2667d0398cea10
          '@.Trim() | Set-Content -Encoding ASCII 'artifact/memstick/PSP/PLUGINS/RA-PSP/login.ini.example'

          @'
          @echo off
          cd /d "%~dp0"
          if not exist "RA-Bridge.exe" (
            echo RA-Bridge.exe nao encontrado.
            pause
            exit /b 1
          )
          start "RA-Bridge" /min "%~dp0RA-Bridge.exe"
          timeout /t 1 /nobreak >nul
          if exist "%~dp0PPSSPPWindows64.exe" (
            start "" "%~dp0PPSSPPWindows64.exe"
            exit /b 0
          )
          if exist "%~dp0PPSSPPWindows.exe" (
            start "" "%~dp0PPSSPPWindows.exe"
            exit /b 0
          )
          echo PPSSPPWindows64.exe nao encontrado nesta pasta.
          echo Deixe o RA-Bridge aberto e inicie o PPSSPP manualmente.
          pause
          '@.Trim() | Set-Content -Encoding ASCII 'artifact/INICIAR_RA-PSP.bat'

          @'
          RA-PSP PPSSPP v0.7 - LOCAL HTTPS BRIDGE

          Extraia diretamente em:
          E:\SteamLibrary\steamapps\common\Emuladores\PSP\

          POR QUE EXISTE O RA-BRIDGE.EXE:
          O sceHttp do PPSSPP 1.20.x nao fornece TLS/HTTPS para o plugin PSP.
          O PRX fala apenas HTTP local com 127.0.0.1:55355.
          O RA-Bridge encaminha apenas pedidos do RetroAchievements usando HTTPS do Windows.

          COMO INICIAR:
          1. Clique duas vezes em INICIAR_RA-PSP.bat.
          2. O RA-Bridge inicia minimizado.
          3. O PPSSPP abre normalmente.
          4. Abra Persona 2: Innocent Sin.
          5. Depois de chegar ao menu/gameplay, pressione L + R + TRIANGLE para conectar.
          6. Pressione L + R + SELECT para ver o status.

          Seu login.ini antigo continua aceito em:
          memstick\SEPLUGINS\RA-PSP\login.ini

          O bridge escuta apenas em 127.0.0.1 e so encaminha HTTPS para retroachievements.org.
          Ele nao registra corpo das requisicoes, senha ou token.

          Log do plugin:
          memstick\PSP\PLUGINS\RA-PSP\ra_psp_ppsspp.log
          '@.Trim() | Set-Content -Encoding UTF8 'artifact/README-RA-PSP-PPSSPP.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: RA-PSP-PPSSPP-v0.7-BRIDGE-DROPIN
          path: artifact
