name: Build RA-PSP PPSSPP

on:
  push:
    branches: [ra-psp-diag]
    paths:
      - 'ra-psp-ppsspp/**'
      - '.github/workflows/ra-psp-ppsspp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pspdev/pspdev-docker:latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply buffered renderer cache patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ra-psp-ppsspp/main.c')
          s = p.read_text()
          s = s.replace('#include <psprtc.h>', '#include <psprtc.h>\n#include <psputils.h>')
          old = '''static void blit_menu(void *surface, int fmt, void *fb, int fb_stride) {
              int y;
              int bpp = bytes_per_pixel(fmt);
              int width = MENU_X1 - MENU_X0;
              for (y = MENU_Y0; y < MENU_Y1; y++) {
                  unsigned char *src = (unsigned char *)surface + (y * W + MENU_X0) * bpp;
                  unsigned char *dst = (unsigned char *)fb + (y * fb_stride + MENU_X0) * bpp;
                  memcpy(dst, src, width * bpp);
              }
          }'''
          new = '''static void blit_menu(void *surface, int fmt, void *fb, int fb_stride) {
              int x, y;
              int width = MENU_X1 - MENU_X0;
              int bpp = bytes_per_pixel(fmt);
              if (fmt == PSP_DISPLAY_PIXEL_FORMAT_8888) {
                  for (y = MENU_Y0; y < MENU_Y1; y++) {
                      uint32_t *src = (uint32_t *)surface + y * W + MENU_X0;
                      volatile uint32_t *dst = (volatile uint32_t *)fb + y * fb_stride + MENU_X0;
                      for (x = 0; x < width; x++) dst[x] = src[x];
                  }
              } else {
                  for (y = MENU_Y0; y < MENU_Y1; y++) {
                      uint16_t *src = (uint16_t *)surface + y * W + MENU_X0;
                      volatile uint16_t *dst = (volatile uint16_t *)fb + y * fb_stride + MENU_X0;
                      for (x = 0; x < width; x++) dst[x] = src[x];
                  }
              }
              sceKernelDcacheWritebackInvalidateRange(
                  (unsigned char *)fb + (MENU_Y0 * fb_stride + MENU_X0) * bpp,
                  (unsigned int)((MENU_Y1 - MENU_Y0) * fb_stride * bpp));
          }'''
          if old not in s:
              raise SystemExit('blit_menu source block not found')
          s = s.replace(old, new)
          if 'sceKernelDelayThread(1000);' not in s:
              raise SystemExit('frame timing line not found')
          s = s.replace('sceKernelDelayThread(1000);', 'sceKernelDelayThread(14500);', 1)
          p.write_text(s)
          PY

      - name: Build PPSSPP user-mode PRX
        working-directory: ra-psp-ppsspp
        run: make clean && make -j2

      - name: Package direct-drop install
        run: |
          mkdir -p artifact/memstick/PSP/PLUGINS/RA-PSP
          cp ra-psp-ppsspp/ra_psp_ppsspp.prx artifact/memstick/PSP/PLUGINS/RA-PSP/ra_psp_ppsspp.prx
          cp ra-psp-ppsspp/plugin.ini artifact/memstick/PSP/PLUGINS/RA-PSP/plugin.ini
          printf '%s\n' \
            'RA-PSP PPSSPP BUFFERED OVERLAY v0.6.3' \
            '' \
            'Extract this ZIP directly into:' \
            'E:\\SteamLibrary\\steamapps\\common\\Emuladores\\PSP\\' \
            '' \
            'Target game: Persona 2 Innocent Sin USA - ULUS10584' \
            '' \
            'Open/close: L + R + SELECT' \
            'Fallback: START + SELECT' \
            'LEFT/RIGHT: change tabs' \
            'UP/DOWN: navigate achievement placeholder rows' \
            'TRIANGLE: test popup' \
            'CIRCLE: close menu' \
            '' \
            'Renderer: off-screen menu + late-frame direct VRAM stores + explicit data-cache writeback.' \
            'This targets partial-frame flicker, early overwrite and cached VRAM writes.' \
            '' \
            'No RetroAchievements login/network yet.' \
            'No fake achievement data is presented as real.' \
            '' \
            'Log:' \
            'memstick\\PSP\\PLUGINS\\RA-PSP\\ra_psp_ppsspp.log' \
            > artifact/README-RA-PSP-PPSSPP.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RA-PSP-PPSSPP-v0.6.3-BUFFERED-OVERLAY-DROPIN
          path: artifact
